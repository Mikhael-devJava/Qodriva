[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qodriva"
version = "0.1.0"
description = "Local static analysis of project structure, exposed secrets, Git hygiene and declared dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["static-analysis", "security", "secrets", "gitignore", "dependencies", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qodriva = "qodriva.main:main"

[tool.setuptools.packages.find]
include = ["qodriva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
