[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qodriva"
version = "0.1.0"
description = "Local static analysis tool for project structure, exposed secrets, Git hygiene and declared dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qodriva = "qodriva.main:main"

[tool.setuptools.packages.find]
include = ["qodriva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
